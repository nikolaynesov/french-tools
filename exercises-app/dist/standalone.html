<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercices de grammaire · A2 → B1</title>
  <style>
/* ============================================================
   Exercices de grammaire · A2 → B1
   Design tokens: validated reference palette (light + dark)
   ============================================================ */

:root {
  color-scheme: light;
  --page: #f7f7f4;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --hairline: #e1e0d9;
  --border: rgba(11, 11, 11, 0.08);
  --accent: #2a78d6;
  --accent-ink: #1c5cab;
  --accent-soft: rgba(42, 120, 214, 0.08);
  --grad: linear-gradient(135deg, #2a78d6, #4a3aa7);

  --role-aux: #1c5cab;
  --role-stem: #0d7a54;
  --role-end: #a63d12;
  --role-part: #4a3aa7;
  --role-inf: #b23a68;
  --role-pron: #52514e;

  --shadow-sm: 0 1px 2px rgba(11, 11, 11, 0.04), 0 2px 8px rgba(11, 11, 11, 0.04);
  --shadow-md: 0 2px 6px rgba(11, 11, 11, 0.05), 0 12px 32px rgba(11, 11, 11, 0.07);
}

@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #111110;
    --surface: #1a1a19;
    --ink: #f5f5f2;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --hairline: #2c2c2a;
    --border: rgba(255, 255, 255, 0.08);
    --accent: #3987e5;
    --accent-ink: #6da7ec;
    --accent-soft: rgba(57, 135, 229, 0.12);
    --grad: linear-gradient(135deg, #3987e5, #9085e9);

    --role-aux: #6da7ec;
    --role-stem: #34c795;
    --role-end: #f08a5e;
    --role-part: #9085e9;
    --role-inf: #e87ba4;
    --role-pron: #c3c2b7;

    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3), 0 2px 8px rgba(0, 0, 0, 0.25);
    --shadow-md: 0 2px 6px rgba(0, 0, 0, 0.35), 0 12px 32px rgba(0, 0, 0, 0.3);
  }
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background:
    radial-gradient(1200px 400px at 50% -100px, var(--accent-soft), transparent 70%),
    var(--page);
  color: var(--ink);
  font-family: "Inter", "SF Pro Text", -apple-system, BlinkMacSystemFont,
    "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.6;
  min-height: 100vh;
}

button,
input,
select {
  font-family: inherit;
}

/* ---------- header ---------- */

.top {
  position: sticky;
  top: 0;
  z-index: 30;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  background: color-mix(in srgb, var(--page) 82%, transparent);
  border-bottom: 1px solid var(--hairline);
}

.top-inner {
  max-width: 860px;
  margin: 0 auto;
  padding: 13px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

.top h1 {
  font-size: 1.02rem;
  font-weight: 700;
  margin: 0;
  letter-spacing: -0.01em;
  flex: 1;
}

.top h1::before {
  content: "✏️";
  margin-right: 8px;
  font-size: 0.95em;
}

.lvl {
  background: var(--grad);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  font-weight: 800;
}

.lang-toggles {
  display: flex;
  align-items: center;
  gap: 5px;
}

.lang-label {
  font-size: 0.72rem;
  color: var(--muted);
  margin-right: 2px;
}

.lang-btn {
  font-size: 0.74rem;
  font-weight: 600;
  padding: 4px 11px;
  cursor: pointer;
  border: 1px solid var(--hairline);
  background: var(--surface);
  color: var(--ink-2);
  border-radius: 999px;
  transition: border-color 0.15s, background 0.15s;
}

.lang-btn:hover {
  border-color: var(--accent);
}

.lang-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

#main {
  max-width: 860px;
  margin: 0 auto;
  padding: 30px 20px 70px;
}

/* ---------- home ---------- */

.hero {
  margin-bottom: 30px;
}

.hero h2 {
  margin: 0 0 4px;
  font-size: 1.65rem;
  font-weight: 800;
  letter-spacing: -0.025em;
}

.sub {
  color: var(--ink-2);
  margin: 0 0 18px;
  font-size: 0.92rem;
}

.stats {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 22px;
}

.stat {
  flex: 1 1 130px;
  max-width: 200px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px 18px 12px;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
}

.stat-n {
  font-size: 1.5rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  line-height: 1.2;
}

.stat-n em {
  font-style: normal;
  font-weight: 600;
  font-size: 0.95rem;
  color: var(--muted);
}

.stat-l {
  font-size: 0.74rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.quick {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}

.big-btn {
  font-size: 0.92rem;
  font-weight: 650;
  padding: 12px 22px;
  border-radius: 12px;
  border: 1px solid var(--hairline);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s;
}

.big-btn:hover:not(:disabled) {
  border-color: var(--accent);
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}

.big-btn:active:not(:disabled) {
  transform: translateY(0);
}

.big-btn.primary {
  background: var(--grad);
  border: none;
  color: #fff;
}

.big-btn:disabled {
  opacity: 0.4;
  cursor: default;
  box-shadow: none;
}

.pill {
  display: inline-block;
  min-width: 20px;
  padding: 0 6px;
  margin-left: 6px;
  border-radius: 999px;
  background: var(--role-end);
  color: #fff;
  font-size: 0.72rem;
  line-height: 18px;
  text-align: center;
}

/* difficulty + aide selectors */

.levels {
  display: flex;
  align-items: center;
  gap: 6px;
}

.levels .lbl {
  font-size: 0.78rem;
  color: var(--muted);
  margin-right: 4px;
  min-width: 72px;
}

.lvl-btn {
  font-size: 0.78rem;
  font-weight: 600;
  padding: 4px 13px;
  cursor: pointer;
  border: 1px solid var(--hairline);
  background: var(--surface);
  color: var(--ink-2);
  border-radius: 999px;
  transition: border-color 0.15s, background 0.15s, color 0.15s;
}

.lvl-btn:hover:not(.on) {
  border-color: var(--accent);
  color: var(--accent-ink);
}

.lvl-btn.on {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--page);
}

.aide-row {
  margin-top: 8px;
  flex-wrap: wrap;
}

.aide-row .lvl-btn.on {
  background: var(--grad);
  border: 1px solid transparent;
  color: #fff;
}

.aide-desc {
  font-size: 0.78rem;
  color: var(--muted);
  font-style: italic;
  margin-left: 6px;
}

/* rule catalogue */

.grp {
  margin: 30px 0;
}

.grp h3 {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.11em;
  color: var(--muted);
  margin: 0 0 10px;
  font-weight: 700;
}

.rule-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
  gap: 10px;
}

.rule-btn {
  text-align: left;
  cursor: pointer;
  padding: 13px 16px 12px;
  border: 1px solid var(--border);
  border-radius: 13px;
  background: var(--surface);
  color: var(--ink);
  display: flex;
  flex-direction: column;
  gap: 3px;
  box-shadow: var(--shadow-sm);
  transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s;
}

.rule-btn:hover:not(:disabled) {
  border-color: var(--accent);
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}

.rule-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.rule-name {
  font-weight: 650;
  font-size: 0.9rem;
  letter-spacing: -0.01em;
}

.rule-meta {
  font-size: 0.74rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.acc {
  color: var(--role-stem);
}

.rule-bar {
  margin-top: 6px;
  height: 4px;
  border-radius: 999px;
  background: var(--hairline);
  overflow: hidden;
}

.rule-bar i {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--role-stem), var(--accent));
}

/* io row */

.io {
  margin-top: 36px;
  display: flex;
  gap: 18px;
  align-items: center;
  flex-wrap: wrap;
  border-top: 1px solid var(--hairline);
  padding-top: 16px;
}

.link-btn {
  font-size: 0.8rem;
  background: none;
  border: 0;
  padding: 0;
  color: var(--accent-ink);
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.link-btn:hover {
  text-decoration-thickness: 2px;
}

.fs-status {
  font-size: 0.82rem;
  color: var(--muted);
}

.fs-status.fs-on {
  color: var(--role-stem);
  font-weight: 600;
}

/* ---------- session ---------- */

.bar {
  height: 5px;
  background: var(--hairline);
  border-radius: 999px;
  overflow: hidden;
  margin-bottom: 16px;
}

.bar-fill {
  height: 100%;
  border-radius: 999px;
  background: var(--grad);
  transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
}

.q-head {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  font-size: 0.78rem;
  color: var(--muted);
  margin-bottom: 14px;
}

.q-count {
  font-weight: 800;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}

.q-rule {
  color: var(--accent-ink);
  font-weight: 600;
}

.aide-sel {
  font-size: 0.78rem;
  font-weight: 600;
  padding: 5px 8px;
  border-radius: 9px;
  border: 1px solid var(--hairline);
  background: var(--surface);
  color: var(--ink-2);
  margin-left: auto;
  cursor: pointer;
}

.q-head .quit {
  margin-left: 4px;
}

.q-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 28px 30px;
  box-shadow: var(--shadow-md);
  animation: rise 0.25s ease both;
}

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

.q-prompt {
  font-size: 1.3rem;
  line-height: 1.6;
  margin: 0 0 6px;
  letter-spacing: -0.01em;
  font-weight: 550;
}

.q-hint {
  font-size: 0.84rem;
  color: var(--muted);
  margin: 0 0 18px;
  font-style: italic;
}

.blank {
  color: var(--accent);
  letter-spacing: 1px;
  font-weight: 700;
  border-bottom: 2px solid var(--accent);
  padding: 0 2px;
}

.cue {
  color: var(--role-stem);
  font-weight: 650;
  background: color-mix(in srgb, var(--role-stem) 9%, transparent);
  padding: 1px 7px;
  border-radius: 7px;
}

/* the rule panel — pulled live from the shared bank */

.rule-panel {
  position: relative;
  border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
  border-radius: 14px;
  padding: 14px 18px;
  margin: 6px 0 18px;
  background: var(--accent-soft);
  font-size: 0.95rem;
}

.rp-head {
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--accent-ink);
  margin-bottom: 8px;
}

.rule-panel .rule-link {
  display: inline-block;
  margin-top: 8px;
  font-size: 0.82rem;
}

.rp-formula {
  margin: 0 0 6px;
  font-size: 1.05rem;
  font-weight: 550;
}

.rp-rule {
  margin: 6px 0;
  color: var(--ink-2);
}

.rp-mnemo {
  margin: 10px 0 0;
  font-size: 0.85rem;
  color: var(--ink-2);
  border-top: 1px dashed color-mix(in srgb, var(--accent) 25%, transparent);
  padding-top: 8px;
}

.rp-table {
  border-collapse: collapse;
  margin: 8px 0 2px;
}

.rp-table td {
  padding: 3px 16px 3px 0;
  font-size: 0.9rem;
  border-bottom: 1px solid color-mix(in srgb, var(--accent) 12%, transparent);
}

.rp-table td.pronoun {
  color: var(--muted);
}

.rp-table tr.hl td {
  background: color-mix(in srgb, var(--accent) 13%, transparent);
  font-weight: 700;
}

.rp-table tr.hl td:first-child {
  border-radius: 6px 0 0 6px;
  box-shadow: inset 3px 0 0 var(--accent);
  padding-left: 8px;
}

.rp-table tr.hl td:last-child {
  border-radius: 0 6px 6px 0;
}

/* colour-coded morphology (same code as the reference app) */

.role {
  font-weight: 700;
  border-bottom: 2px solid;
  padding: 0 1px;
  border-radius: 2px;
}

.role-aux  { color: var(--role-aux);  border-color: var(--role-aux); }
.role-stem { color: var(--role-stem); border-color: var(--role-stem); }
.role-end  { color: var(--role-end);  border-color: var(--role-end); }
.role-part { color: var(--role-part); border-color: var(--role-part); }
.role-inf  { color: var(--role-inf);  border-color: var(--role-inf); }
.role-pron { color: var(--role-pron); border-color: var(--role-pron); }

/* answer skeleton (aide 1) — letter tiles */

.skel {
  display: flex;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 4px;
  margin: 0 0 18px;
}

.sk {
  width: 22px;
  height: 30px;
  border-radius: 6px;
  background: color-mix(in srgb, var(--accent) 8%, transparent);
  border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent);
  border-bottom-width: 2px;
}

.sk.sk-show {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--accent-ink);
  font-weight: 800;
  font-size: 1.05rem;
  background: color-mix(in srgb, var(--accent) 15%, transparent);
}

.sk-sep {
  color: var(--accent-ink);
  font-weight: 800;
  font-size: 1.05rem;
  align-self: center;
}

.sk-gap {
  width: 12px;
}

/* indice button (aide 3) */

.indice {
  font-size: 0.9rem;
  margin: 0 0 16px;
  display: inline-block;
}

/* answering */

.answer-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

#answer {
  flex: 1;
  min-width: 220px;
  font-size: 1.05rem;
  padding: 12px 16px;
  border: 1.5px solid var(--hairline);
  border-radius: 12px;
  background: var(--page);
  color: var(--ink);
  transition: border-color 0.15s, box-shadow 0.15s;
}

#answer:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.choices {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.choice {
  text-align: left;
  cursor: pointer;
  padding: 13px 18px;
  border: 1.5px solid var(--hairline);
  border-radius: 12px;
  background: var(--page);
  color: var(--ink);
  font-size: 0.98rem;
  transition: border-color 0.12s, background 0.12s, transform 0.12s;
}

.choice:hover:not(:disabled) {
  border-color: var(--accent);
  background: var(--surface);
  transform: translateX(2px);
}

.choice:disabled {
  opacity: 0.55;
  cursor: default;
}

/* feedback */

.fb {
  margin-top: 20px;
  padding: 16px 20px;
  border-radius: 14px;
  border: 1px solid;
  animation: rise 0.2s ease both;
}

.fb-ok {
  border-color: color-mix(in srgb, var(--role-stem) 35%, transparent);
  background: color-mix(in srgb, var(--role-stem) 8%, transparent);
}

.fb-near {
  border-color: color-mix(in srgb, var(--role-end) 35%, transparent);
  background: color-mix(in srgb, var(--role-end) 8%, transparent);
}

.fb-bad {
  border-color: color-mix(in srgb, var(--role-inf) 35%, transparent);
  background: color-mix(in srgb, var(--role-inf) 8%, transparent);
}

.fb-head {
  margin: 0 0 6px;
  font-weight: 800;
  font-size: 0.95rem;
  letter-spacing: -0.01em;
}

.fb-ok .fb-head { color: var(--role-stem); }
.fb-near .fb-head { color: var(--role-end); }
.fb-bad .fb-head { color: var(--role-inf); }

.fb-line {
  margin: 0 0 6px;
  font-size: 0.95rem;
}

.fb-lbl {
  color: var(--muted);
  font-size: 0.8rem;
}

.fb code {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.92em;
  background: color-mix(in srgb, var(--ink) 7%, transparent);
  padding: 2px 8px;
  border-radius: 6px;
}

.fb-why {
  margin: 0 0 8px;
  font-size: 0.9rem;
  color: var(--ink-2);
}

.rule-link {
  font-size: 0.8rem;
  color: var(--accent-ink);
  text-underline-offset: 3px;
}

#next {
  margin-top: 14px;
}

/* ---------- result ---------- */

.score {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 8px;
}

.ring {
  --ring-c: var(--accent);
  width: 92px;
  height: 92px;
  border-radius: 50%;
  background: conic-gradient(var(--ring-c) calc(var(--p) * 1%), var(--hairline) 0);
  display: grid;
  place-items: center;
  flex-shrink: 0;
}

.ring::before {
  content: "";
  grid-area: 1 / 1;
  width: 68px;
  height: 68px;
  border-radius: 50%;
  background: var(--page);
}

.ring span {
  grid-area: 1 / 1;
  font-weight: 800;
  font-size: 1.05rem;
  font-variant-numeric: tabular-nums;
  z-index: 1;
}

.score.great .ring { --ring-c: var(--role-stem); }
.score.mid .ring { --ring-c: var(--role-end); }
.score.low .ring { --ring-c: var(--role-inf); }

.score-n {
  font-size: 2.4rem;
  font-weight: 800;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
}

.score-n em {
  font-style: normal;
  font-size: 1.3rem;
  color: var(--muted);
  font-weight: 600;
}

.score.great .score-n { color: var(--role-stem); }
.score.mid .score-n { color: var(--role-end); }
.score.low .score-n { color: var(--role-inf); }

.result h3 {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--muted);
  margin: 28px 0 6px;
  font-weight: 700;
}

.misses {
  list-style: none;
  margin: 0 0 24px;
  padding: 0;
}

.miss {
  padding: 14px 0;
  border-bottom: 1px solid var(--hairline);
}

.miss-p {
  font-size: 0.98rem;
  margin-bottom: 4px;
}

.miss-a {
  font-size: 0.92rem;
}

.miss-a .bad {
  color: var(--role-inf);
  text-decoration: line-through;
}

.miss-a .good {
  color: var(--role-stem);
  font-weight: 650;
}

.miss-w {
  font-size: 0.84rem;
  color: var(--muted);
  margin-top: 3px;
}

.perfect {
  font-size: 1.05rem;
  color: var(--role-stem);
  font-weight: 650;
}

/* « avec aide » badge */

.badge-help {
  font-size: 0.68rem;
  padding: 2px 9px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--muted) 16%, transparent);
  color: var(--ink-2);
  font-weight: 650;
  vertical-align: middle;
  margin-left: 6px;
  white-space: nowrap;
}

/* ---------- footer ---------- */

.foot {
  max-width: 860px;
  margin: 0 auto;
  text-align: center;
  color: var(--muted);
  font-size: 0.78rem;
  padding: 22px 20px;
  border-top: 1px solid var(--hairline);
}

/* ---------- small screens ---------- */

@media (max-width: 560px) {
  .q-card {
    padding: 20px 18px;
  }
  .q-prompt {
    font-size: 1.15rem;
  }

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function markedHtml(src) {
    let out = "";
    let last = 0;
    const re = /\{([^:{}]+):(aux|stem|end|part|inf|pron)\}/g;
    let m;
    while ((m = re.exec(src)) !== null) {
      out += escapeHtml(src.slice(last, m.index));
      out += `<span class="role role-${m[2]}">${escapeHtml(m[1])}</span>`;
      last = m.index + m[0].length;
    }
    out += escapeHtml(src.slice(last));
    return out;
  }

    return `
  <div class="result">
    <div class="score ${pct >= 80 ? "great" : pct >= 50 ? "mid" : "low"}">
      <div class="ring" style="--p:${pct}"><span>${pct}%</span></div>
      <span class="score-n">${ok}<em>/${n}</em></span>
    </div>
    <p class="sub">${esc(s.label)} \xB7 aide : ${AIDE_META[state.aide].label.toLowerCase()}${helpedOk ? ` \xB7 ${helpedOk} bonne${helpedOk > 1 ? "s" : ""} r\xE9ponse${helpedOk > 1 ? "s" : ""} avec aide` : ""}</p>
    ${missed.length ? `<h3>\xC0 revoir (${missed.length})</h3><ul class="misses">${list}</ul>` : `<p class="perfect">S\xE9rie parfaite. \u{1F389}</p>`}
    <div class="quick">
      ${missed.length ? `<button class="big-btn primary" id="retry">Rejouer mes erreurs</button>` : ""}
      <button class="big-btn" id="home">\u2190 Retour</button>
    </div>
  </div>`;
  }
  function render() {
    const main = document.getElementById("main");
    if (state.screen === "home") main.innerHTML = homeHtml();
    else if (state.screen === "session") main.innerHTML = sessionHtml();
    else main.innerHTML = resultHtml();
    const inp = document.getElementById("answer");
    if (inp && !state.session?.answered) inp.focus();
  }
  function submit(given) {
    const s = state.session;
    if (s.answered) return;
    const d = s.items[s.i];
    const helped = helpedNow();
    const kind = grade(d, given);
    const ok = kind === "ok";
    s.answered = true;
    s.lastOk = ok;
    s.lastKind = kind;
    s.given = given;
    s.results.push({ drill: d, ok, given, helped });
    recordAnswer(d, ok, helped);
    persist();
    render();
  }
  function next() {
    const s = state.session;
    if (s.i + 1 >= s.items.length) {
      state.screen = "result";
    } else {
      s.i++;
      s.answered = false;
      s.given = "";
      s.indice = false;
      s.sawHelp = false;
    }
    render();
  }
  function start(ruleId) {
    const label = ruleId === "all" ? "R\xE9vision g\xE9n\xE9rale" : ruleId === "errors" ? "Mes erreurs" : ruleName(ruleId);
    const sess = buildSet(ruleId, label);
    if (!sess.items.length) return;
    state.session = sess;
    state.screen = "session";
    render();
  }
  function download() {
    const blob = new Blob([JSON.stringify(progress, null, 2)], {
      type: "application/json"
    });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "progression-exercices.json";
    a.click();
    URL.revokeObjectURL(a.href);
  }
  function init() {
    document.body.addEventListener("click", (e) => {
      const t = e.target;
      const startBtn = t.closest("[data-start]");
      if (startBtn) return start(startBtn.dataset.start);
      const lvl = t.closest("[data-level]");
      if (lvl) {
        state.level = Number(lvl.dataset.level);
        persist();
        return render();
      }
      const aide = t.closest("[data-aide]");
      if (aide) {
        state.aide = Number(aide.dataset.aide);
        persist();
        return render();
      }
      if (t.closest("#fs-connect")) {
        void fstore.connect().then((data) => {
          if (data) applySaved(data);
          persist();
          render();
        }).catch(() => {
        });
        return;
      }
      if (t.closest("#fs-reconnect")) {
        void fstore.reconnect().then((data) => {
          if (data) applySaved(data);
          render();
        });
        return;
      }
      if (t.closest("#fs-forget")) {
        void fstore.forget().then(render);
        return;
      }
      if (t.closest("#indice")) {
        state.session.indice = true;
        return render();
      }
      const ch = t.closest("[data-choice]");
      if (ch) {
        const d = state.session.items[state.session.i];
        return submit(d.choices[Number(ch.dataset.choice)]);
      }
      if (t.closest("#submit")) {
        const s = state.session;
        if (s.answered) return next();
        const inp = document.getElementById("answer");
        return submit(inp.value);
      }
      if (t.closest("#next")) return next();
      if (t.closest("#quit")) {
        state.screen = state.session.results.length ? "result" : "home";
        return render();
      }
      if (t.closest("#home")) {
        state.screen = "home";
        state.session = null;
        return render();
      }
      if (t.closest("#retry")) return start("errors");
      if (t.closest("#export")) return download();
    });
    document.body.addEventListener("keydown", (e) => {
      if (e.key !== "Enter" || state.screen !== "session") return;
      e.preventDefault();
      const s = state.session;
      if (s.answered) return next();
      const inp = document.getElementById("answer");
      if (inp) submit(inp.value);
    });
    document.getElementById("main").addEventListener("change", (e) => {
      const sel = e.target;
      if (sel.id === "aide-sel") {
        state.aide = Number(sel.value);
        persist();
        return render();
      }
      const f = e.target;
      if (f.id !== "import-file" || !f.files?.[0]) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(String(reader.result));
          if (data.version === 1) {
            applySaved(data);
            persist();
            render();
          }
        } catch {
        }
      };
      reader.readAsText(f.files[0]);
    });
    document.querySelectorAll(".lang-btn").forEach(
      (b) => b.addEventListener("click", () => {
        state.lang = b.dataset.lang;
        document.querySelectorAll(".lang-btn").forEach((x) => x.classList.toggle("active", x === b));
        persist();
        render();
      })
    );
    render();
    void fstore.init().then(() => {
      if (state.screen === "home") render();
    });
    window.addEventListener("beforeunload", () => void fstore.flush());
    window.__grade = (id, given) => {
      const d = DRILLS.find((x) => x.id === id);
      return d ? grade(d, given) : "unknown";
    };
  }
  document.addEventListener("DOMContentLoaded", init);
})();

</script>
</body>
</html>
