<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Les Temps du Français · A2</title>
  <style>
/* ============================================================
   Les Temps du Français — A2 · styles
   Palette: validated reference palette (light + dark)
   ============================================================ */

:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --hairline: #e1e0d9;
  --border: rgba(11, 11, 11, 0.1);
  --accent: #2a78d6;
  --accent-ink: #1c5cab;

  /* morphology roles */
  --role-aux: #1c5cab;
  --role-stem: #0d7a54;
  --role-end: #a63d12;
  --role-part: #4a3aa7;
  --role-inf: #b23a68;
  --role-pron: #52514e;

  --zone-past: rgba(166, 61, 18, 0.05);
  --zone-future: rgba(13, 122, 84, 0.06);
}

@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --hairline: #2c2c2a;
    --border: rgba(255, 255, 255, 0.1);
    --accent: #3987e5;
    --accent-ink: #6da7ec;

    --role-aux: #6da7ec;
    --role-stem: #34c795;
    --role-end: #f08a5e;
    --role-part: #9085e9;
    --role-inf: #e87ba4;
    --role-pron: #c3c2b7;

    --zone-past: rgba(240, 138, 94, 0.07);
    --zone-future: rgba(52, 199, 149, 0.08);
  }
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  line-height: 1.55;
  font-size: 16px;
}

/* ---------- header ---------- */

.top {
  position: sticky;
  top: 0;
  z-index: 10;
  background: color-mix(in srgb, var(--page) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--hairline);
}

.top-inner {
  max-width: 1060px;
  margin: 0 auto;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

h1 {
  font-size: 1.15rem;
  margin: 0;
  letter-spacing: 0.01em;
}

h1 .lvl {
  color: var(--accent-ink);
  font-weight: 800;
}

.nav {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}

.nav-btn {
  border: 1px solid transparent;
  background: none;
  color: var(--ink-2);
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 0.92rem;
  cursor: pointer;
  font-family: inherit;
}

.nav-btn:hover {
  background: color-mix(in srgb, var(--ink) 6%, transparent);
}

.nav-btn.active {
  background: var(--accent);
  color: #fff;
  font-weight: 600;
}

.lang-toggles {
  margin-left: auto;
  display: flex;
  gap: 6px;
  align-items: center;
}

.lang-label {
  font-size: 0.78rem;
  color: var(--muted);
}

.lang-btn {
  border: 1px solid var(--hairline);
  background: var(--surface);
  color: var(--ink-2);
  padding: 5px 12px;
  border-radius: 999px;
  font-size: 0.85rem;
  cursor: pointer;
  font-family: inherit;
}

.lang-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 600;
}

/* ---------- layout ---------- */

#main {
  max-width: 1060px;
  margin: 0 auto;
  padding: 24px 20px 80px;
}

.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px 28px;
  margin-bottom: 24px;
}

.panel-title {
  margin: 0 0 4px;
  font-size: 1.25rem;
}

.panel-sub {
  margin: 0 0 18px;
  color: var(--ink-2);
  font-size: 0.95rem;
}

/* ---------- translations ---------- */

.tr {
  display: none;
  color: var(--muted);
  font-size: 0.88em;
  font-style: italic;
}

body.show-en .tr-en,
body.show-uk .tr-uk {
  display: block;
}

span.fr {
  display: inline;
}

/* ---------- colour roles ---------- */

.role {
  font-weight: 700;
  border-bottom: 2px solid;
  padding: 0 1px;
  border-radius: 2px;
}

.role-aux { color: var(--role-aux); border-color: var(--role-aux); }
.role-stem { color: var(--role-stem); border-color: var(--role-stem); }
.role-end { color: var(--role-end); border-color: var(--role-end); }
.role-part { color: var(--role-part); border-color: var(--role-part); }
.role-inf { color: var(--role-inf); border-color: var(--role-inf); }
.role-pron { color: var(--role-pron); border-color: var(--role-pron); }

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 18px;
  padding: 12px 18px;
  margin-bottom: 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  font-size: 0.85rem;
  color: var(--ink-2);
}

.legend-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.legend-dot {
  width: 11px;
  height: 11px;
  border-radius: 3px;
  display: inline-block;
}

.legend-dot.role-aux { background: var(--role-aux); }
.legend-dot.role-stem { background: var(--role-stem); }
.legend-dot.role-end { background: var(--role-end); }
.legend-dot.role-part { background: var(--role-part); }
.legend-dot.role-inf { background: var(--role-inf); }
.legend-dot.role-pron { background: var(--role-pron); }

.legend .tr {
  display: none !important; /* keep the legend compact */
}

/* ---------- cards ---------- */

.toc {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
  position: sticky;
  top: 62px;
  z-index: 5;
  background: color-mix(in srgb, var(--page) 92%, transparent);
  backdrop-filter: blur(6px);
  padding: 8px 0;
}

.chip {
  border: 1px solid var(--hairline);
  background: var(--surface);
  color: var(--ink-2);
  padding: 6px 13px;
  border-radius: 999px;
  font-size: 0.85rem;
  cursor: pointer;
  font-family: inherit;
}

.chip:hover {
  border-color: var(--accent);
  color: var(--accent-ink);
}

.cards {
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 26px 30px;
  scroll-margin-top: 130px;
}

.card.flash {
  animation: flash 1.6s ease-out;
}

@keyframes flash {
  0% { box-shadow: 0 0 0 3px var(--accent); }
  100% { box-shadow: 0 0 0 3px transparent; }
}

.card-head {
  display: flex;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
}

.card h2 {
  margin: 0;
  font-size: 1.5rem;
}

.badge {
  font-size: 0.75rem;
  padding: 3px 10px;
  border-radius: 999px;
  font-weight: 600;
  white-space: nowrap;
}

.badge-core {
  background: color-mix(in srgb, var(--accent) 14%, transparent);
  color: var(--accent-ink);
}

.badge-soft {
  background: color-mix(in srgb, var(--muted) 18%, transparent);
  color: var(--ink-2);
}

.tagline {
  color: var(--ink-2);
  margin: 8px 0 4px;
  font-size: 1.02rem;
}

.card h3 {
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  margin: 26px 0 8px;
}

.card section:first-of-type h3 {
  margin-top: 18px;
}

.usage {
  margin: 0;
  padding-left: 20px;
}

.usage li {
  margin-bottom: 7px;
}

.formula {
  font-size: 1.18rem;
  background: color-mix(in srgb, var(--ink) 4%, transparent);
  border: 1px dashed var(--hairline);
  padding: 12px 18px;
  border-radius: 10px;
  margin: 6px 0 10px;
}

.notes {
  margin: 0 0 14px;
  padding-left: 20px;
  color: var(--ink-2);
  font-size: 0.93rem;
}

.notes li {
  margin-bottom: 5px;
}

/* conjugation tables */

.conj-row {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
}

.conj {
  flex: 1 1 260px;
  max-width: 420px;
}

.conj-title {
  font-size: 0.88rem;
  color: var(--ink-2);
  margin: 4px 0 6px;
  font-weight: 600;
}

table {
  border-collapse: collapse;
  width: 100%;
}

td {
  padding: 5px 12px 5px 0;
  border-bottom: 1px solid var(--hairline);
  font-size: 0.97rem;
}

td.pronoun {
  color: var(--muted);
  white-space: nowrap;
  width: 1%;
  padding-right: 18px;
}

td.form {
  font-weight: 500;
}

.table-foot {
  font-size: 0.85rem;
  color: var(--muted);
  margin: 8px 0 0;
}

.extra {
  margin-top: 16px;
  border: 1px solid var(--hairline);
  border-radius: 10px;
  padding: 10px 16px;
}

.extra summary {
  cursor: pointer;
  font-size: 0.92rem;
  color: var(--accent-ink);
  font-weight: 600;
}

.extra-table {
  margin-top: 10px;
}

.extra-table td {
  font-size: 0.9rem;
}

/* mnemo */

.mnemo {
  background: color-mix(in srgb, var(--accent) 7%, transparent);
  border-radius: 10px;
  padding: 4px 18px 12px;
  margin-top: 22px;
}

.mnemo h3 {
  color: var(--accent-ink);
  margin-top: 14px;
}

.mnemo p {
  margin: 0;
}

/* examples */

.ex-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}

.examples {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.example {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  border: 1px solid var(--hairline);
  border-radius: 10px;
  padding: 10px 14px;
  cursor: pointer;
  transition: border-color 0.15s;
}

.example:hover {
  border-color: var(--accent);
}

.reveal-btn {
  flex-shrink: 0;
  border: 1px solid var(--hairline);
  background: none;
  color: var(--accent-ink);
  border-radius: 8px;
  padding: 4px 10px;
  font-size: 0.8rem;
  cursor: pointer;
  font-family: inherit;
  margin-top: 2px;
  min-width: 92px;
}

.example .when-shown { display: none; }
.example.revealed .when-shown { display: inline; }
.example.revealed .when-hidden { display: none; }

.ex-body {
  flex: 1;
}

.ex-fr {
  font-size: 1.05rem;
  filter: blur(7px);
  user-select: none;
  transition: filter 0.25s ease;
}

.example.revealed .ex-fr {
  filter: none;
  user-select: auto;
}

.ex-note {
  display: none;
  font-size: 0.86rem;
  color: var(--ink-2);
  margin-top: 4px;
}

.example.revealed .ex-note {
  display: block;
}

.link-btn {
  background: none;
  border: none;
  padding: 0;
  color: var(--accent-ink);
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
  font-family: inherit;
  font-size: 0.92em;
}

.related ul {
  margin: 0;
  padding-left: 20px;
}

.related li {
  margin-bottom: 6px;
  font-size: 0.95rem;
}

/* ---------- timeline SVG ---------- */

.timeline,
.hub {
  width: 100%;
  height: auto;
  display: block;
}

.zone-past { fill: var(--zone-past); }
.zone-future { fill: var(--zone-future); }

.zone-label {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.14em;
  fill: var(--muted);
}

.axis {
  stroke: var(--muted);
  stroke-width: 2;
}

.axis-head {
  fill: var(--muted);
}

.now-line {
  stroke: var(--accent);
  stroke-width: 2.5;
  stroke-dasharray: 5 4;
}

.now-dot {
  fill: var(--accent);
}

.now-pulse {
  fill: none;
  stroke: var(--accent);
  stroke-width: 2;
  animation: pulse 2.2s ease-out infinite;
  transform-origin: center;
  transform-box: fill-box;
}

@keyframes pulse {
  0% { opacity: 0.8; transform: scale(1); }
  100% { opacity: 0; transform: scale(2.4); }
}

.now-label {
  fill: var(--accent-ink);
  font-weight: 700;
}

.tl-label {
  font-size: 15px;
  font-weight: 600;
  fill: var(--ink);
}

.tl-hint {
  font-weight: 400;
  fill: var(--muted);
  font-size: 13px;
}

.mark-wave {
  fill: none;
  stroke: var(--ink-2);
  stroke-width: 2.5;
  stroke-linecap: round;
}

.mark-dot {
  fill: var(--ink-2);
}

.mark-dot-hollow {
  fill: var(--surface);
  stroke: var(--ink-2);
  stroke-width: 2.5;
}

.mark-tick {
  stroke: var(--ink-2);
  stroke-width: 2;
}

.mark-arrow {
  stroke: var(--ink-2);
  stroke-width: 2.5;
}

.mark-arrow-head {
  fill: var(--ink-2);
}

.tl-item {
  cursor: pointer;
}

.tl-item:hover .tl-label,
.tl-item:focus .tl-label {
  fill: var(--accent-ink);
  text-decoration: underline;
}

.tl-item:hover .mark-wave,
.tl-item:hover .mark-arrow,
.tl-item:hover .mark-tick,
.tl-item:hover .mark-dot-hollow {
  stroke: var(--accent);
}

.tl-item:hover .mark-dot:not(.mark-dot-hollow),
.tl-item:hover .mark-arrow-head {
  fill: var(--accent);
}

.tl-item:focus {
  outline: none;
}

.tl-item:focus-visible .tl-label {
  fill: var(--accent-ink);
}

.modes-label {
  font-size: 13px;
  fill: var(--muted);
}

.mode-chip {
  fill: color-mix(in srgb, var(--ink) 5%, transparent);
  stroke: var(--hairline);
}

.tl-item:hover .mode-chip {
  stroke: var(--accent);
}

.mode-text {
  font-size: 13px;
  fill: var(--ink-2);
  font-weight: 600;
}

/* ---------- hub SVG ---------- */

.spoke-line {
  stroke: var(--hairline);
  stroke-width: 2;
}

.recipe-bg {
  fill: var(--page);
  stroke: var(--hairline);
}

.recipe {
  font-size: 12.5px;
  fill: var(--ink-2);
}

.node-bg {
  fill: color-mix(in srgb, var(--accent) 8%, var(--surface));
  stroke: var(--border);
}

.tl-item:hover .node-bg,
.tl-item:focus-visible .node-bg {
  stroke: var(--accent);
  stroke-width: 2;
}

.node-text {
  font-size: 15px;
  font-weight: 600;
  fill: var(--ink);
}

.hub-bg {
  fill: var(--accent);
}

.hub-text {
  fill: #fff;
  font-weight: 800;
  font-size: 16px;
  letter-spacing: 0.05em;
}

.chain-text {
  font-size: 14px;
  fill: var(--ink-2);
}

.chain-strong {
  font-weight: 700;
  fill: var(--role-inf);
}

.chain-link {
  fill: var(--accent-ink);
  text-decoration: underline;
  cursor: pointer;
  font-weight: 600;
}

/* ---------- compare ---------- */

.cmp-pickers {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}

.cmp-pickers label {
  font-weight: 700;
  color: var(--muted);
  font-size: 0.9rem;
  display: flex;
  align-items: center;
  gap: 8px;
}

.cmp-pickers select {
  font-size: 1rem;
  padding: 8px 12px;
  border-radius: 10px;
  border: 1px solid var(--hairline);
  background: var(--surface);
  color: var(--ink);
  font-family: inherit;
}

.vs {
  color: var(--muted);
  font-style: italic;
}

.cmp-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 24px;
}

@media (max-width: 760px) {
  .cmp-grid {
    grid-template-columns: 1fr;
  }
}

.cmp-col {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px 24px;
}

.cmp-name {
  margin: 0 0 10px;
  font-size: 1.15rem;
}

.cmp-col h4 {
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  margin: 18px 0 6px;
}

.cmp-col .formula {
  font-size: 1.02rem;
}

.cmp-table td {
  font-size: 0.92rem;
}

.cmp-more {
  margin: 14px 0 0;
}

.face-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  padding: 16px 0;
  border-top: 1px solid var(--hairline);
}

@media (max-width: 760px) {
  .face-row {
    grid-template-columns: 1fr;
  }
}

.face-cell {
  background: color-mix(in srgb, var(--ink) 3%, transparent);
  border-radius: 10px;
  padding: 12px 16px;
}

.face-tense {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--muted);
  margin-bottom: 6px;
  font-weight: 700;
}

.face-fr {
  font-size: 1.05rem;
}

.face-point {
  grid-column: 1 / -1;
  font-size: 0.92rem;
  color: var(--ink-2);
  padding: 2px 4px 0;
}

.no-contrast {
  color: var(--ink-2);
  background: var(--surface);
  border: 1px dashed var(--hairline);
  border-radius: 12px;
  padding: 16px 20px;
}

/* ---------- footer ---------- */

.foot {
  text-align: center;
  color: var(--muted);
  font-size: 0.82rem;
  padding: 20px;
  border-top: 1px solid var(--hairline);
}

</style>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <h1>Les Temps du Français <span class="lvl">A2</span></h1>
      <nav class="nav">
        <button class="nav-btn active" data-view="overview" type="button">Frise du temps</button>
        <button class="nav-btn" data-view="cards" type="button">Les 8 temps</button>
        <button class="nav-btn" data-view="compare" type="button">Comparer</button>
      </nav>
      <div class="lang-toggles">
        <span class="lang-label">Traductions :</span>

        <button class="lang-btn" id="toggle-uk" type="button">УКР</button>
      </div>
    </div>
  </header>

  <main id="main"></main>

  <footer class="foot">
    Objectif DELF B2 · étape A2 · les exemples se révèlent au clic — essayez de les deviner d'abord !
  </footer>

  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function marked(src) {
    let out = "";
    let last = 0;
    const re = /\{([^:{}]+):(aux|stem|end|part|inf|pron)\}/g;
    let m;
    while ((m = re.exec(src)) !== null) {
      out += esc(src.slice(last, m.index));
      out += `<span class="role role-${m[2]}">${esc(m[1])}</span>`;
      last = m.index + m[0].length;
    }
    out += esc(src.slice(last));
    return out;
  }
  function tri(t, frHtml = false) {
    const fr = frHtml ? marked(t.fr) : esc(t.fr);
    return `<span class="fr">${fr}</span><span class="tr tr-en">${esc(t.en)}</span><span class="tr tr-uk">${esc(t.uk)}</span>`;
  }
  function tenseById(id) {
    const t = TENSES.find((x) => x.id === id);
    if (!t) throw new Error(`Unknown tense: ${id}`);

  function hubSvg() {
    const nodes = [

      { id: "passe-recent", x: 240, y: 322, label: "pass\xE9 r\xE9cent", recipe: "venir + de + infinitif" },
      { id: "futur-proche", x: 660, y: 322, label: "futur proche", recipe: "aller + infinitif" },
      { id: "imperatif", x: 770, y: 84, label: "imp\xE9ratif", recipe: "pr\xE9sent sans sujet" }
    ];
    const hub = { x: 450, y: 195 };
    const spokes = nodes.map((n) => {
      const dx = n.x - hub.x;
      const dy = n.y - hub.y;
      const len = Math.hypot(dx, dy);
      const sx = hub.x + dx / len * 66;
      const sy = hub.y + dy / len * 40;
      const ex = n.x - dx / len * 78;
      const ey = n.y - dy / len * 30;
      const mx = (sx + ex) / 2;
      const my = (sy + ey) / 2;
      return `
      <g class="spoke">

</svg>`;

  }
  function compareHtml() {
    const opts = (sel) => TENSES.map(
      (t) => `<option value="${t.id}" ${t.id === sel ? "selected" : ""}>${esc(
        t.name
      )}</option>`
    ).join("");
    const a = tenseById(state.compareA);
    const b = tenseById(state.compareB);
    const key = [a.id, b.id].sort().join("|");
    const contrast = CONTRASTS.find((c) => c.key === key);
    const aIsFirst = a.id.localeCompare(b.id) <= 0;
    const cell = (t, ex) => `
        <div class="face-cell">
          <div class="face-tense">${esc(t.name)}</div>
          <div class="face-fr">${marked(ex.fr)}</div>
          <div class="tr tr-en">${esc(ex.en)}</div>
          <div class="tr tr-uk">${esc(ex.uk)}</div>
        </div>`;
    const faceRows = contrast ? contrast.rows.map(
      (r) => `
      <div class="face-row">
        ${aIsFirst ? cell(a, r.a) + cell(b, r.b) : cell(a, r.b) + cell(b, r.a)}
        <div class="face-point">\u2192 ${tri(r.point)}</div>
      </div>`
    ).join("") : "";
    const faceSection = contrast ? `<section class="panel face">
        <h3 class="panel-title">Face \xE0 face</h3>
        <p class="panel-sub">${tri(contrast.headline)}</p>
        ${faceRows}
      </section>` : `<p class="no-contrast">${tri({
      fr: "Pas de duel pr\xE9par\xE9 pour cette paire \u2014 mais comparez la formation et l'usage ci-dessus ! Paires recommand\xE9es : pass\xE9 compos\xE9 \u2194 imparfait, futur proche \u2194 futur simple.",
      en: "No prepared duel for this pair \u2014 but compare the formation and usage above! Recommended pairs: pass\xE9 compos\xE9 \u2194 imparfait, futur proche \u2194 futur simple.",
      uk: "\u0414\u043B\u044F \u0446\u0456\u0454\u0457 \u043F\u0430\u0440\u0438 \u043D\u0435\u043C\u0430\u0454 \u0433\u043E\u0442\u043E\u0432\u043E\u0433\u043E \u0434\u0443\u0435\u043B\u044E \u2014 \u0430\u043B\u0435 \u043F\u043E\u0440\u0456\u0432\u043D\u044F\u0439\u0442\u0435 \u0443\u0442\u0432\u043E\u0440\u0435\u043D\u043D\u044F \u0442\u0430 \u0432\u0436\u0438\u0442\u043E\u043A \u0432\u0438\u0449\u0435! \u0420\u0435\u043A\u043E\u043C\u0435\u043D\u0434\u043E\u0432\u0430\u043D\u0456 \u043F\u0430\u0440\u0438: pass\xE9 compos\xE9 \u2194 imparfait, futur proche \u2194 futur simple."
    })}</p>`;
    return `
  <div class="cmp-pickers">
    <label>A <select id="cmp-a">${opts(state.compareA)}</select></label>
    <span class="vs">contre</span>
    <label>B <select id="cmp-b">${opts(state.compareB)}</select></label>
  </div>
  ${legendHtml()}
  <div class="cmp-grid">
    ${compareColumn(a)}
    ${compareColumn(b)}
  </div>
  ${faceSection}`;
  }
  function render() {
    const main = document.getElementById("main");
    document.querySelectorAll(".nav-btn").forEach((b) => b.classList.toggle("active", b.dataset.view === state.view));
    if (state.view === "overview") main.innerHTML = overviewHtml();
    else if (state.view === "cards") main.innerHTML = cardsHtml();
    else main.innerHTML = compareHtml();
    if (state.view === "compare") {
      document.getElementById("cmp-a").addEventListener(
        "change",
        (e) => {
          state.compareA = e.target.value;
          render();
        }
      );
      document.getElementById("cmp-b").addEventListener(
        "change",
        (e) => {
          state.compareB = e.target.value;
          render();
        }
      );
    }
  }
  function goToTense(id) {
    if (state.view !== "cards") {
      state.view = "cards";
      render();
    }
    const el = document.getElementById(`card-${id}`);
    if (el) {
      el.scrollIntoView({ behavior: "smooth", block: "start" });
      el.classList.remove("flash");
      void el.offsetWidth;
      el.classList.add("flash");
    }
  }
  function init() {
    document.querySelectorAll(".nav-btn").forEach(
      (b) => b.addEventListener("click", () => {
        state.view = b.dataset.view;
        render();
        window.scrollTo({ top: 0 });
      })
    );
    const btnEn = document.getElementById("toggle-en");
    const btnUk = document.getElementById("toggle-uk");
    btnEn.addEventListener("click", () => {
      document.body.classList.toggle("show-en");
      btnEn.classList.toggle("active");
    });
    btnUk.addEventListener("click", () => {
      document.body.classList.toggle("show-uk");
      btnUk.classList.toggle("active");
    });
    document.body.addEventListener("click", (e) => {
      const target = e.target;
      const goto = target.closest("[data-goto]");
      if (goto) {
        goToTense(goto.dataset.goto);
        return;
      }
      const revealAll = target.closest(".reveal-all");
      if (revealAll) {
        const card = document.getElementById(`card-${revealAll.dataset.card}`);
        const examples = card.querySelectorAll(".example");
        const anyHidden = Array.from(examples).some(
          (x) => !x.classList.contains("revealed")
        );
        examples.forEach((x) => x.classList.toggle("revealed", anyHidden));
        revealAll.textContent = anyHidden ? "Tout cacher" : "Tout montrer";
        return;
      }
      const ex = target.closest(".example");
      if (ex && (target.closest(".reveal-btn") || !ex.classList.contains("revealed"))) {
        ex.classList.toggle("revealed");
        return;
      }
    });
    document.body.addEventListener("keydown", (e) => {
      if (e.key !== "Enter" && e.key !== " ") return;
      const goto = e.target.closest?.("[data-goto]");
      if (goto) {
        e.preventDefault();
        goToTense(goto.dataset.goto);
      }
    });
    render();
  }
  document.addEventListener("DOMContentLoaded", init);
})();

</script>
</body>
</html>
